[project]
name = "localstudies-ia"
version = "0.1.0"
description = "Orquestrador Mestre-Servos via LM Studio + LM Link para modelagem 3D no Blender a partir de arquivos DWG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.3.0",
    "httpx>=0.27.0",
    "mcp>=1.2.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
]

[project.scripts]
localstudies-chat = "localstudies.chat_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localstudies"]
